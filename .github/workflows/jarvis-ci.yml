name: JARVIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jarvis-core-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.1 --activate

      - name: Install root dependencies without setup downloads
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint JARVIS core modifications
        run: |
          pnpm exec eslint \
            server/src/config.ts \
            server/src/schemas/core-schemas.ts \
            server/src/core/llm-manager/types.ts \
            server/src/core/llm-manager/llm-provider.ts \
            server/src/core/llm-manager/llm-providers/ollama-llm-provider.ts \
            scripts/setup/setup-config.js \
            scripts/setup/setup.js

      - name: Validate JARVIS YAML configuration
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import YAML from 'yaml'; const c=YAML.parse(fs.readFileSync('config.sample.yml','utf8')); if(c.language!=='it-IT') throw new Error('language'); if(c.llm.default!=='ollama/qwen3.5:9b') throw new Error('default model'); if(c.llm.providers.ollama.base_url!=='http://127.0.0.1:11434/v1') throw new Error('ollama URL'); console.log('JARVIS config OK')"

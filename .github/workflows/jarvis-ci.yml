name: JARVIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.1 --activate

      - name: Install dependencies without setup downloads
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install computer-use tool dependency
        run: pnpm install --dir tools/computer_use/cua/src/nodejs --ignore-scripts

      - name: Build Aurora types
        run: pnpm run build:aurora

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

name: JARVIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jarvis-core-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.1 --activate

      - name: Install root dependencies without setup downloads
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint JARVIS core modifications
        run: |
          pnpm exec eslint \
            server/src/config.ts \
            server/src/schemas/core-schemas.ts \
            server/src/core/llm-manager/types.ts \
            server/src/core/llm-manager/llm-provider.ts \
            server/src/core/llm-manager/llm-routing.ts \
            server/src/core/llm-manager/model-context-windows.ts \
            server/src/core/llm-manager/llm-duties/react-llm-duty/constants.ts \
            server/src/core/llm-manager/persona.ts \
            server/src/core/config-states/model-state.ts \
            server/src/core/jarvis-policy/jarvis-policy-manager.ts \
            server/src/core/http-server/http-server.ts \
            server/src/core/http-server/api/brain-status/get.ts \
            server/src/core/http-server/api/brain-status/index.ts \
            server/src/core/http-server/api/brain-control/post.ts \
            server/src/core/http-server/api/brain-control/index.ts \
            server/src/core/llm-manager/llm-providers/ollama-llm-provider.ts \
            scripts/setup/setup-config.js \
            scripts/setup/setup.js \
            scripts/jarvis/apply-low-resource-profile.js \
            app/src/js/brain-dashboard.js \
            app/src/js/jarvis-quick-chat.js \
            app/src/js/client.js \
            app/src/js/main.js \
            app/src/js/profile-auth.js \
            server/src/core/context-manager/context-files/leon-context-file.ts \
            server/src/core/context-manager/context-files/leon-runtime-context-file.ts \
            server/src/built-in-command/commands/voice-command/voice-command.ts \
            server/src/built-in-command/commands/jarvis-command/jarvis-command.ts \
            server/src/built-in-command/index.ts \
            server/src/core/voice/voice-resource-state.ts \
            server/src/constants.ts \
            tools/ge360/core/src/nodejs/ge360-tool.ts \
            tools/ge360/core/src/nodejs/ge360-resource-resolver.ts \
            tools/ge360/core/src/nodejs/index.ts \
            tools/jarvis/brain/src/nodejs/jarvis-brain-tool.ts \
            tools/jarvis/brain/src/nodejs/index.ts

      - name: Test JARVIS core
        run: pnpm exec vitest run --config vitest.config.ts test/jarvis/unit

      - name: Validate JARVIS voice Python
        run: |
          python3 -m py_compile tcp_server/src/lib/asr/api.py
          python3 -m py_compile tcp_server/src/lib/tcp_server.py
          python3 -m py_compile tcp_server/src/lib/wake_word/api.py
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const settings = JSON.parse(fs.readFileSync('tcp_server/settings.json', 'utf8'))
          if (settings.wake_word.model_file_name !== 'Hey_Jarvis.onnx') {
            throw new Error('wake-word model must remain a dedicated Hey Jarvis model')
          }
          console.log('JARVIS voice settings OK')
          NODE

      - name: Validate Debian deployment scripts
        run: |
          bash -n deploy/debian/install-service.sh
          bash -n deploy/debian/jarvis-doctor.sh
          bash -n deploy/debian/prepare-local-ai.sh
          bash -n deploy/debian/configure-ollama-low-resource.sh
          bash -n deploy/debian/jarvis-benchmark.sh
          bash -n deploy/debian/enable-brain-service-control.sh
          bash -n deploy/debian/disable-brain-service-control.sh
          bash -n deploy/debian/install-jarvis-linux.sh
          bash -n deploy/debian/run-jarvis-service.sh
          bash -n install.sh
          grep -Fq 'User=__JARVIS_USER__' deploy/debian/ge360-jarvis.service
          grep -Fq 'ExecStart=__PNPM_BIN__ start' deploy/debian/ge360-jarvis.service
          grep -Fq 'Environment=PATH=__JARVIS_PATH__' deploy/debian/ge360-jarvis.service
          grep -Fq 'JARVIS_LOCAL_CONTEXT_WINDOW_TOKENS=8192' deploy/debian/ge360-jarvis.service
          grep -Fq 'OLLAMA_MAX_LOADED_MODELS=1' deploy/debian/ollama-low-resource.conf
          grep -Fq 'OLLAMA_KV_CACHE_TYPE=q8_0' deploy/debian/ollama-low-resource.conf
          grep -Fq 'LEON_PYTHON_PATH' deploy/debian/install-jarvis-linux.sh
          grep -Fq 'LEON_UV_PATH' deploy/debian/install-jarvis-linux.sh
          grep -Fq 'https://astral.sh/uv/install.sh' deploy/debian/install-jarvis-linux.sh
          grep -Fq 'pnpm install --frozen-lockfile' deploy/debian/install-jarvis-linux.sh
          grep -Fq 'pnpm run jarvis:low-resource' deploy/debian/install-jarvis-linux.sh
          grep -Fq 'pnpm run jarvis:prepare-ai' deploy/debian/install-jarvis-linux.sh
          grep -Fq 'systemctl restart ge360-jarvis.service' deploy/debian/install-jarvis-linux.sh
          grep -Fq 'JARVIS_NODE_BIN=__NODE_BIN__' deploy/debian/ge360-jarvis.service
          grep -Fq 'run-jarvis-service.sh' deploy/debian/ge360-jarvis.service
          grep -Fq 'server/dist/pre-check.js' deploy/debian/run-jarvis-service.sh
          grep -Fq 'exec "${NODE_BIN}" server/dist/index.js' deploy/debian/run-jarvis-service.sh

      - name: Validate Italian default language
        run: |
          grep -Fq "language: it-IT" config.sample.yml
          grep -Fq "config.language = 'it-IT'" scripts/jarvis/apply-low-resource-profile.js
          grep -Fq "Rispondi sempre in italiano" server/src/core/llm-manager/persona.ts
          grep -Fq "The default owner-facing language is Italian" server/src/core/llm-manager/llm-duties/react-llm-duty/agent-loop.ts

      - name: Build production server TypeScript
        run: pnpm run build:server

      - name: Build production app with Brain Dashboard
        run: |
          TMP_HOME="$(mktemp -d)"
          mkdir -p "$TMP_HOME/profiles/just-me"
          cp config.sample.yml "$TMP_HOME/profiles/just-me/config.yml"
          LEON_HOME="$TMP_HOME" pnpm run build:app
          test -f app/dist/index.html
          grep -Fq 'Brain' app/dist/index.html
          grep -R -Fq 'BOOST' app/dist
          grep -R -Fq 'Benchmark' app/dist
          grep -R -Fq 'Restart JARVIS' app/dist
          grep -R -Fq 'JARVIS Chat' app/dist
          grep -R -Fq 'Chat con JARVIS' app/dist
          rm -rf "$TMP_HOME"

      - name: Validate Brain control safety wiring
        run: |
          grep -Fq "action === 'restart-jarvis' || action === 'restart-ollama'" server/src/core/http-server/api/brain-control/post.ts
          grep -Fq "JARVIS_ALLOW_SYSTEM_SERVICE_CONTROL" server/src/core/http-server/api/brain-control/post.ts
          grep -Fq "'-n', 'systemctl', 'restart', 'ollama.service'" server/src/core/http-server/api/brain-control/post.ts
          grep -Fq "keep_alive: 0" server/src/core/http-server/api/brain-control/post.ts
          grep -Fq "action: 'approve'" app/src/js/brain-dashboard.js

      - name: Test low-resource profile migration
        run: |
          TMP_HOME="$(mktemp -d)"
          mkdir -p "$TMP_HOME/profiles/just-me"
          cp config.sample.yml "$TMP_HOME/profiles/just-me/config.yml"
          LEON_HOME="$TMP_HOME" node scripts/jarvis/apply-low-resource-profile.js
          test "$(find "$TMP_HOME/profiles/just-me" -name 'config.yml.backup-low-resource-*' | wc -l)" -eq 1
          LEON_HOME="$TMP_HOME" node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import YAML from 'yaml'
          const home = process.env.LEON_HOME
          const c = YAML.parse(fs.readFileSync(path.join(home, 'profiles', 'just-me', 'config.yml'), 'utf8'))
          if (c.llm.default !== 'ollama/qwen3.5:4b') throw new Error('migrated model')
          if (c.runtime.agent_max_iterations !== 64) throw new Error('migrated agent iterations')
          if (c.runtime.pulse_enabled !== false) throw new Error('migrated pulse')
          if (c.runtime.private_diary_enabled !== false) throw new Error('migrated diary')
          if (c.mood.mode !== 'default') throw new Error('migrated mood')
          NODE
          rm -rf "$TMP_HOME"

      - name: Validate JARVIS configuration and GE360 manifests
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          import YAML from 'yaml'
          const c = YAML.parse(fs.readFileSync('config.sample.yml', 'utf8'))
          if (c.language !== 'it-IT') throw new Error('language')
          if (c.llm.default !== 'ollama/qwen3.5:4b') throw new Error('default model')
          if (c.llm.providers.ollama.base_url !== 'http://127.0.0.1:11434/v1') throw new Error('ollama URL')
          if (c.runtime.agent_max_iterations !== 64) throw new Error('agent iterations')
          if (c.runtime.pulse_enabled !== false) throw new Error('pulse must default off')
          if (c.runtime.private_diary_enabled !== false) throw new Error('private diary must default off')
          if (c.mood.mode !== 'default') throw new Error('auto weather mood must default off')
          const toolkit = JSON.parse(fs.readFileSync('tools/ge360/toolkit.json', 'utf8'))
          const tool = JSON.parse(fs.readFileSync('tools/ge360/core/tool.json', 'utf8'))
          const brainToolkit = JSON.parse(fs.readFileSync('tools/jarvis/toolkit.json', 'utf8'))
          const brainTool = JSON.parse(fs.readFileSync('tools/jarvis/brain/tool.json', 'utf8'))
          const settings = JSON.parse(fs.readFileSync('tools/ge360/core/settings.sample.json', 'utf8'))
          if (toolkit.name !== 'GE360' || !toolkit.tools.includes('core')) throw new Error('GE360 toolkit')
          if (tool.toolkit_id !== 'ge360' || tool.tool_id !== 'core') throw new Error('GE360 tool')
          if (brainToolkit.name !== 'JARVIS Brain' || !brainToolkit.tools.includes('brain')) throw new Error('JARVIS Brain toolkit')
          if (brainTool.toolkit_id !== 'jarvis' || brainTool.tool_id !== 'brain') throw new Error('JARVIS Brain tool')
          for (const fn of ['getStatus', 'benchmark', 'setMode', 'setModel', 'unloadModel']) {
            if (!brainTool.functions[fn]) throw new Error('missing JARVIS Brain function: ' + fn)
          }
          if (settings.writes_enabled !== true) throw new Error('GE360 master write gate must be enabled for approval flow')
          if (settings.yellow_auto_approve !== false) throw new Error('yellow actions must require approval by default')
          for (const fn of ['discoverResources', 'listResource', 'getResource', 'request']) {
            if (!tool.functions[fn]) throw new Error('missing GE360 function: ' + fn)
          }
          if (!tool.functions.request.parameters.properties.options.properties.method.enum.includes('DELETE')) {
            throw new Error('DELETE must be routed through RED policy rather than silently absent')
          }
          console.log('JARVIS + GE360 manifests OK')
          NODE

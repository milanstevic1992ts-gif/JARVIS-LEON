name: JARVIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jarvis-core-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.1 --activate

      - name: Install root dependencies without setup downloads
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint JARVIS core modifications
        run: |
          pnpm exec eslint \
            server/src/config.ts \
            server/src/schemas/core-schemas.ts \
            server/src/core/llm-manager/types.ts \
            server/src/core/llm-manager/llm-provider.ts \
            server/src/core/llm-manager/llm-routing.ts \
            server/src/core/config-states/model-state.ts \
            server/src/core/jarvis-policy/jarvis-policy-manager.ts \
            server/src/core/llm-manager/llm-providers/ollama-llm-provider.ts \
            scripts/setup/setup-config.js \
            scripts/setup/setup.js \
            server/src/core/context-manager/context-files/leon-context-file.ts \
            server/src/core/context-manager/context-files/leon-runtime-context-file.ts \
            server/src/built-in-command/commands/voice-command/voice-command.ts \
            server/src/built-in-command/commands/jarvis-command/jarvis-command.ts \
            server/src/built-in-command/index.ts \
            server/src/core/voice/voice-resource-state.ts \
            server/src/constants.ts \
            tools/ge360/core/src/nodejs/ge360-tool.ts \
            tools/ge360/core/src/nodejs/ge360-resource-resolver.ts \
            tools/ge360/core/src/nodejs/index.ts

      - name: Test JARVIS core
        run: pnpm exec vitest run --config vitest.config.ts test/jarvis/unit

      - name: Validate JARVIS voice Python
        run: |
          python3 -m py_compile tcp_server/src/lib/asr/api.py
          python3 -m py_compile tcp_server/src/lib/tcp_server.py
          python3 -m py_compile tcp_server/src/lib/wake_word/api.py
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const settings = JSON.parse(fs.readFileSync('tcp_server/settings.json', 'utf8'))
          if (settings.wake_word.model_file_name !== 'Hey_Jarvis.onnx') {
            throw new Error('wake-word model must remain a dedicated Hey Jarvis model')
          }
          console.log('JARVIS voice settings OK')
          NODE

      - name: Validate Debian deployment scripts
        run: |
          bash -n deploy/debian/install-service.sh
          bash -n deploy/debian/jarvis-doctor.sh
          bash -n deploy/debian/prepare-local-ai.sh
          grep -Fq 'User=__JARVIS_USER__' deploy/debian/ge360-jarvis.service
          grep -Fq 'ExecStart=__PNPM_BIN__ start' deploy/debian/ge360-jarvis.service

      - name: Validate JARVIS configuration and GE360 manifests
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          import YAML from 'yaml'
          const c = YAML.parse(fs.readFileSync('config.sample.yml', 'utf8'))
          if (c.language !== 'it-IT') throw new Error('language')
          if (c.llm.default !== 'ollama/qwen3.5:9b') throw new Error('default model')
          if (c.llm.providers.ollama.base_url !== 'http://127.0.0.1:11434/v1') throw new Error('ollama URL')
          const toolkit = JSON.parse(fs.readFileSync('tools/ge360/toolkit.json', 'utf8'))
          const tool = JSON.parse(fs.readFileSync('tools/ge360/core/tool.json', 'utf8'))
          const settings = JSON.parse(fs.readFileSync('tools/ge360/core/settings.sample.json', 'utf8'))
          if (toolkit.name !== 'GE360' || !toolkit.tools.includes('core')) throw new Error('GE360 toolkit')
          if (tool.toolkit_id !== 'ge360' || tool.tool_id !== 'core') throw new Error('GE360 tool')
          if (settings.writes_enabled !== true) throw new Error('GE360 master write gate must be enabled for approval flow')
          if (settings.yellow_auto_approve !== false) throw new Error('yellow actions must require approval by default')
          for (const fn of ['discoverResources', 'listResource', 'getResource', 'request']) {
            if (!tool.functions[fn]) throw new Error('missing GE360 function: ' + fn)
          }
          if (!tool.functions.request.parameters.properties.options.properties.method.enum.includes('DELETE')) {
            throw new Error('DELETE must be routed through RED policy rather than silently absent')
          }
          console.log('JARVIS + GE360 manifests OK')
          NODE
